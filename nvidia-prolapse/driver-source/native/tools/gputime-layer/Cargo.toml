[package]
name = "vk-layer-perf-gputime"
version = "0.2.0"
edition = "2021"
publish = false
description = "Vulkan layer: GPU time per render pass, per dispatch, per command buffer and per frame, on any driver"

[lib]
name = "VkLayer_PERF_gputime"
path = "src/lib.rs"
crate-type = ["cdylib"]

[[bin]]
name = "gputime-compare"
path = "src/compare.rs"

[dependencies]
# Types and PFN signatures only; no loader, no linking against libvulkan.
ash = { version = "=0.38.0", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
debug = 1
panic = "abort"

# Standalone package (not a member of native/'s package).
[workspace]
